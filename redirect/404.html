<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Kotbo Docs a déménagé</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://kotbo.fr/docs/" />
  <meta http-equiv="refresh" content="0; url=https://kotbo.fr/docs/" />
  <script>
    // Garde le chemin : docs.kotbo.fr/dashboard/x → kotbo.fr/docs/dashboard/x
    location.replace('https://kotbo.fr/docs' + location.pathname + location.search + location.hash);
  </script>
</head>
<body>
  <p>La documentation est maintenant sur <a href="https://kotbo.fr/docs/">kotbo.fr/docs</a>.</p>
</body>
</html>
