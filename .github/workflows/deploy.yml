name: Redirect docs.kotbo.fr to kotbo.fr/docs

# Les docs sont construites par le workflow de Kotbo-Bot/Landing-Page et servies sous
# kotbo.fr/docs. Ce dépôt ne publie plus qu'une page de redirection pour docs.kotbo.fr
# (GitHub Pages ne sait pas faire de 301).

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
