name: Trigger Landing-Page docs build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'redirect/**'
      - 'README.md'
      - 'AGENTS.md'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Landing-Page deploy
        env:
          GH_TOKEN: ${{ secrets.LANDING_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret LANDING_DEPLOY_TOKEN manquant dans Kotbo-Bot/kotdocs"
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Kotbo-Bot/Landing-Page/dispatches \
            -d '{"event_type":"docs-updated"}'
